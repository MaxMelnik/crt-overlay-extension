
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRT Overlay</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="header">
    <h2>CRT Overlay</h2>
    <div class="subtitle">Retro display effects</div>
</div>

<div class="control">
    <span class="label">CRT Effect</span>

    <label class="switch">
        <input
                type="checkbox"
                id="toggle"
                aria-label="Enable CRT effect"
        >
        <span class="slider"></span>
    </label>
</div>

<div class="control flicker-control">
    <span class="label">Screen Flicker</span>

    <label class="switch">
        <input
                type="checkbox"
                id="flicker-toggle"
                aria-label="Enable screen flicker"
        >
        <span class="slider"></span>
    </label>
</div>

<script src="popup.js"></script>
</body>
</html>
